<section
  *ngIf="items.length > 0"
  class="col-12 ps-0 pe-0 carousel-wrap"
  id="servicios"
  (mouseenter)="onMouseEnter()"
  (mouseleave)="onMouseLeave()"
>
  <section
    class="carousel"
    (touchstart)="onTouchStart($event)"
    (touchmove)="onTouchMove($event)"
    (touchend)="onTouchEnd()"
  >
    <article
      class="carousel-image"
      *ngFor="let item of items; let i = index"
      [class.active]="i === activeIndex"
      [attr.aria-hidden]="i !== activeIndex"
    >
      <img [src]="item.imageUrl" [alt]="item.altText || ('Banner ' + (i + 1))" />
    </article>

    <ng-container *ngIf="items.length > 1">
      <button type="button" class="nav-arrow left" aria-label="Anterior" (click)="prev()">‹</button>
      <button type="button" class="nav-arrow right" aria-label="Siguiente" (click)="next()">›</button>

      <div class="dots" role="tablist" aria-label="Paginación carrusel">
        <button
          type="button"
          class="dot"
          *ngFor="let _ of items; let i = index"
          [class.active]="i === activeIndex"
          (click)="goTo(i)"
          [attr.aria-label]="'Ir a slide ' + (i + 1)"
          [attr.aria-current]="i === activeIndex ? 'true' : null"
        ></button>
      </div>
    </ng-container>
  </section>
</section>
